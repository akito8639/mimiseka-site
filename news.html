  <p class="one">イベント、公開のお知らせ、アプリの更新。ミミセカからの小さな知らせを、新しい順に。</p>

<script src="tayori.js?v=20260922a"></script>
<script>
(() => {
  'use strict';
  const main = document.getElementById('main');
  const items = (window.TAYORI || []).slice().sort((a, b) => b.date.localeCompare(a.date));
  if (!items.length) { main.innerHTML = '<p class="empty">まだ便りはありません。</p>'; return; }
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = (d) => { const [y, m, day] = d.split('-'); return `${y}.${m}.${day}`; };
  let year = '', html = '';
  for (const it of items) {
    const y = it.date.slice(0, 4);
    if (y !== year) { year = y; html += `<div class="year">${y}</div>`; }
    const kindCls = it.kind === 'イベント' ? 'kind event' : 'kind';
    html += `<article id="${esc(it.date)}">
      <div class="meta"><time datetime="${esc(it.date)}">${fmt(it.date)}</time><span class="${kindCls}">${esc(it.kind)}</span>${it.app ? `<span class="kind app">${esc(it.app)}</span>` : ''}</div>
      <h2><a href="#${esc(it.date)}">${esc(it.title)}</a></h2>
      <p class="body">${esc(it.body)}</p>
      ${it.photo ? `<figure><img src="${esc(it.photo)}" alt="${esc(it.photoAlt || '')}" loading="lazy" width="1600" height="900">${it.caption ? `<figcaption>${esc(it.caption)}</figcaption>` : ''}</figure>` : ''}
      ${it.link ? `<p class="more"><a href="${esc(it.link)}">くわしく →</a></p>` : ''}
    </article>`;
  }
  main.innerHTML = html;
})();
</script>
