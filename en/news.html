<script src="../tayori.js?v=20261007a"></script>
<script>
(() => {
  'use strict';
  const main = document.getElementById('main');
  const items = (window.TAYORI || []).slice().sort((a, b) => b.date.localeCompare(a.date));
  if (!items.length) { main.innerHTML = '<p class="empty">No notices yet.</p>'; return; }
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = (d) => { const [y, m, day] = d.split('-'); return `${y}.${m}.${day}`; };
  // 写真のパスは tayori.js が持つ（サイト直下からの相対）。この頁は /en/ にあるので 1 階層戻す。
  // 絶対パスにはしない —— 秘密の経路で下見するとき、頭に別の階層が付くため。
  const asset = (u) => (/^https?:/.test(u) ? u : '../' + u);
  let year = '', html = '';
  for (const raw of items) {
    const it = window.TAYORI_L ? window.TAYORI_L(raw) : raw;
    const y = it.date.slice(0, 4);
    if (y !== year) { year = y; html += `<div class="year">${y}</div>`; }
    const kindCls = (raw.kind === 'イベント') ? 'kind event' : 'kind';
    html += `<article id="${esc(it.anchor || it.date)}">
      <div class="meta"><time datetime="${esc(it.date)}">${fmt(it.date)}</time><span class="${kindCls}">${esc(it.kind)}</span>${it.app ? `<span class="kind app-name">${esc(it.app)}</span>` : ''}</div>
      <h2><a href="#${esc(it.date)}">${esc(it.title)}</a></h2>
      <p class="body">${esc(it.body)}</p>
      ${it.photo ? `<figure><img src="${esc(asset(it.photo))}" alt="${esc(it.photoAlt || '')}" loading="lazy" width="1600" height="900">${it.caption ? `<figcaption>${esc(it.caption)}</figcaption>` : ''}</figure>` : ''}
      ${it.link ? `<p class="more"><a href="${esc(it.link)}">More →</a></p>` : ''}
    </article>`;
  }
  main.innerHTML = html;
})();
</script>
