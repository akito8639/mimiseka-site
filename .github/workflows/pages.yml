# 公開の流れ:
#   draft ブランチに push → 本番と同じドメインの、推測できない下層パス（Actions の secret PREVIEW_PATH）に載る。
#   本番はそのまま。プレビューの頁には noindex を入れる。
#   確認できたら draft を main にマージ → https://mimiseka.jp/ が更新される。
# どちらの push でも 1 つのサイト（main を根に、draft を下層に）を組み直して配信する。
name: Deploy site

on:
  push:
    branches: [main, draft]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (本番)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - name: Checkout draft (プレビュー)
        uses: actions/checkout@v4
        continue-on-error: true   # draft がまだ無いときは本番だけ組む
        with:
          ref: draft
          path: draft
      - name: Assemble
        env:
          PREVIEW_PATH: ${{ secrets.PREVIEW_PATH }}
        run: |
          mkdir -p _site
          rsync -a --exclude .git --exclude .github main/ _site/
          if [ -f draft/index.html ] && [ -n "$PREVIEW_PATH" ]; then
            mkdir -p "_site/$PREVIEW_PATH"
            rsync -a --exclude .git --exclude .github --exclude CNAME draft/ "_site/$PREVIEW_PATH/"
            # プレビューは検索に載せない（robots.txt にパスを書くと居場所が知れるので、頁側の noindex だけ）
            find "_site/$PREVIEW_PATH" -name '*.html' -exec sed -i 's#<head>#<head>\n<meta name="robots" content="noindex, nofollow">#' {} +
            echo "preview: assembled"
          else
            echo "preview: skipped"
          fi
          echo "== root"; ls _site | grep -v "^$PREVIEW_PATH$" | head -30
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
